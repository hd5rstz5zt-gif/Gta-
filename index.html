<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>2D GTA Mobile</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      touch-action: manipulation;
    }
    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #111;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }
    #game-container {
      position: relative;
      width: 100vw;
      height: 100vh;
    }
    canvas {
      display: block;
      width: 100%;
      height: 100%;
    }

    /* HUD Overlay */
    #hud {
      position: absolute;
      top: 10px;
      left: 10px;
      right: 10px;
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      pointer-events: none;
      z-index: 10;
    }
    .hud-box {
      background: rgba(0, 0, 0, 0.65);
      padding: 8px 14px;
      border-radius: 8px;
      color: #fff;
      font-weight: bold;
      border: 1px solid rgba(255, 255, 255, 0.15);
      backdrop-filter: blur(4px);
    }
    .stars {
      color: #ffcc00;
      font-size: 20px;
      letter-spacing: 2px;
    }
    .health-bar-bg {
      width: 120px;
      height: 12px;
      background: #444;
      border-radius: 6px;
      overflow: hidden;
      margin-top: 4px;
      border: 1px solid #000;
    }
    .health-bar-fill {
      width: 100%;
      height: 100%;
      background: #2ecc71;
      transition: width 0.1s linear, background-color 0.2s;
    }

    /* Mobile Controls Overlay */
    #mobile-controls {
      position: absolute;
      bottom: 15px;
      left: 0;
      right: 0;
      height: 180px;
      pointer-events: none;
      z-index: 10;
      display: flex;
      justify-content: space-between;
      padding: 0 15px;
    }

    .touch-group {
      position: relative;
      width: 160px;
      height: 160px;
      pointer-events: auto;
    }

    .btn {
      position: absolute;
      background: rgba(255, 255, 255, 0.2);
      border: 2px solid rgba(255, 255, 255, 0.4);
      border-radius: 50%;
      color: #fff;
      display: flex;
      justify-content: center;
      align-items: center;
      font-weight: bold;
      font-size: 14px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.3);
      backdrop-filter: blur(2px);
    }
    .btn:active {
      background: rgba(255, 255, 255, 0.45);
      transform: scale(0.95);
    }

    /* D-Pad Buttons */
    #btn-up    { top: 0; left: 55px; width: 50px; height: 50px; }
    #btn-down  { bottom: 0; left: 55px; width: 50px; height: 50px; }
    #btn-left  { top: 55px; left: 0; width: 50px; height: 50px; }
    #btn-right { top: 55px; right: 0; width: 50px; height: 50px; }

    /* Action Buttons */
    #btn-action { bottom: 10px; right: 10px; width: 65px; height: 65px; background: rgba(46, 204, 113, 0.4); border-color: #2ecc71; font-size: 12px; text-align: center; }
    #btn-radio  { bottom: 85px; right: 20px; width: 50px; height: 50px; background: rgba(155, 89, 182, 0.4); border-color: #9b59b6; font-size: 11px; }
    #btn-horn   { bottom: 20px; right: 85px; width: 50px; height: 50px; background: rgba(241, 196, 15, 0.4); border-color: #f1c40f; font-size: 11px; }

    /* Game Over Screen */
    #game-over {
      position: absolute;
      inset: 0;
      background: rgba(180, 0, 0, 0.85);
      color: white;
      display: none;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      z-index: 20;
    }
    #game-over h1 {
      font-size: 48px;
      margin-bottom: 10px;
      letter-spacing: 4px;
      text-shadow: 2px 2px 10px #000;
    }
    #game-over button {
      padding: 12px 24px;
      font-size: 18px;
      font-weight: bold;
      border: none;
      border-radius: 25px;
      background: #fff;
      color: #b40000;
      cursor: pointer;
      box-shadow: 0 4px 15px rgba(0,0,0,0.4);
    }
  </style>
</head>
<body>

  <div id="game-container">
    <canvas id="canvas"></canvas>

    <!-- HUD -->
    <div id="hud">
      <div class="hud-box">
        <div>HEALTH</div>
        <div class="health-bar-bg"><div id="health-fill" class="health-bar-fill"></div></div>
      </div>
      <div class="hud-box" style="text-align: right;">
        <div>WANTED LEVEL</div>
        <div id="stars" class="stars">☆☆☆</div>
        <div id="radio-display" style="font-size:11px; color:#aaa; margin-top:2px;">RADIO: OFF</div>
      </div>
    </div>

    <!-- Mobile Controls -->
    <div id="mobile-controls">
      <!-- D-PAD -->
      <div class="touch-group">
        <div class="btn" id="btn-up">▲</div>
        <div class="btn" id="btn-down">▼</div>
        <div class="btn" id="btn-left">◄</div>
        <div class="btn" id="btn-right">►</div>
      </div>

      <!-- Actions -->
      <div class="touch-group">
        <div class="btn" id="btn-action">CAR / EXIT</div>
        <div class="btn" id="btn-radio">RADIO</div>
        <div class="btn" id="btn-horn">HORN</div>
      </div>
    </div>

    <!-- Game Over -->
    <div id="game-over">
      <h1 id="go-title">BUSTED / WASTED</h1>
      <p style="margin-bottom: 20px;" id="go-desc">You were stopped by the police!</p>
      <button onclick="restartGame()">PLAY AGAIN</button>
    </div>
  </div>

<script>
// --- AUDIO SYSTEM (Web Audio API Synthesizer) ---
class AudioSystem {
  constructor() {
    this.ctx = null;
    this.radioStations = ['OFF', 'RETRO SYNTH', 'BASS BOOST', 'CHILL WAVE'];
    this.currentStation = 0;
    this.musicInterval = null;
    this.step = 0;
  }

  init() {
    if (!this.ctx) {
      this.ctx = new (window.AudioContext || window.webkitAudioContext)();
    }
  }

  playCrash() {
    if (!this.ctx) return;
    const osc = this.ctx.createOscillator();
    const gain = this.ctx.createGain();
    osc.type = 'sawtooth';
    osc.frequency.setValueAtTime(120, this.ctx.currentTime);
    osc.frequency.exponentialRampToValueAtTime(30, this.ctx.currentTime + 0.3);
    gain.gain.setValueAtTime(0.5, this.ctx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.3);
    osc.connect(gain);
    gain.connect(this.ctx.destination);
    osc.start();
    osc.stop(this.ctx.currentTime + 0.3);
  }

  playSiren() {
    if (!this.ctx) return;
    const osc = this.ctx.createOscillator();
    const gain = this.ctx.createGain();
    osc.type = 'sine';
    const now = this.ctx.currentTime;
    osc.frequency.setValueAtTime(600, now);
    osc.frequency.linearRampToValueAtTime(900, now + 0.25);
    osc.frequency.linearRampToValueAtTime(600, now + 0.5);
    gain.gain.setValueAtTime(0.1, now);
    gain.gain.exponentialRampToValueAtTime(0.01, now + 0.5);
    osc.connect(gain);
    gain.connect(this.ctx.destination);
    osc.start();
    osc.stop(now + 0.5);
  }

  playHorn() {
    if (!this.ctx) return;
    const osc1 = this.ctx.createOscillator();
    const osc2 = this.ctx.createOscillator();
    const gain = this.ctx.createGain();
    osc1.type = 'sawtooth'; osc2.type = 'sawtooth';
    osc1.frequency.value = 350; osc2.frequency.value = 440;
    gain.gain.setValueAtTime(0.2, this.ctx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.4);
    osc1.connect(gain); osc2.connect(gain);
    gain.connect(this.ctx.destination);
    osc1.start(); osc2.start();
    osc1.stop(this.ctx.currentTime + 0.4);
    osc2.stop(this.ctx.currentTime + 0.4);
  }

  cycleRadio() {
    this.init();
    this.currentStation = (this.currentStation + 1) % this.radioStations.length;
    if (this.musicInterval) clearInterval(this.musicInterval);

    const radioDisplay = document.getElementById('radio-display');
    radioDisplay.innerText = 'RADIO: ' + this.radioStations[this.currentStation];

    if (this.currentStation > 0) {
      this.musicInterval = setInterval(() => this.playRadioNote(), 200);
    }
  }

  playRadioNote() {
    if (!this.ctx || this.currentStation === 0) return;
    const osc = this.ctx.createOscillator();
    const gain = this.ctx.createGain();
    osc.type = this.currentStation === 1 ? 'sawtooth' : (this.currentStation === 2 ? 'square' : 'sine');
    
    const scale = [130.81, 146.83, 164.81, 174.61, 196.00, 220.00];
    const freq = scale[(this.step + this.currentStation * 2) % scale.length];
    osc.frequency.value = freq;

    gain.gain.setValueAtTime(0.05, this.ctx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + 0.18);

    osc.connect(gain);
    gain.connect(this.ctx.destination);
    osc.start();
    osc.stop(this.ctx.currentTime + 0.18);

    this.step++;
  }
}

const audio = new AudioSystem();

// --- GAME SETUP & CONSTANTS ---
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');

function resizeCanvas() {
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
}
window.addEventListener('resize', resizeCanvas);
resizeCanvas();

const MAP_SIZE = 3000;
const ROAD_WIDTH = 140;
const BLOCK_SIZE = 500;

// Inputs
const keys = { up: false, down: false, left: false, right: false };

// --- INPUT LISTENERS ---
// Keyboard
window.addEventListener('keydown', (e) => {
  audio.init();
  if (e.key === 'ArrowUp' || e.key === 'w' || e.key === 'W') keys.up = true;
  if (e.key === 'ArrowDown' || e.key === 's' || e.key === 'S') keys.down = true;
  if (e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'A') keys.left = true;
  if (e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D') keys.right = true;
  if (e.key === 'f' || e.key === 'F' || e.key === 'e' || e.key === 'E') toggleVehicle();
  if (e.key === 'r' || e.key === 'R') audio.cycleRadio();
  if (e.key === 'h' || e.key === 'H') audio.playHorn();
});

window.addEventListener('keyup', (e) => {
  if (e.key === 'ArrowUp' || e.key === 'w' || e.key === 'W') keys.up = false;
  if (e.key === 'ArrowDown' || e.key === 's' || e.key === 'S') keys.down = false;
  if (e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'A') keys.left = false;
  if (e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D') keys.right = false;
});

// Mobile Touch Controls
function setupTouchButton(id, keyName) {
  const btn = document.getElementById(id);
  const handleStart = (e) => { e.preventDefault(); audio.init(); keys[keyName] = true; };
  const handleEnd = (e) => { e.preventDefault(); keys[keyName] = false; };
  btn.addEventListener('touchstart', handleStart);
  btn.addEventListener('touchend', handleEnd);
  btn.addEventListener('mousedown', handleStart);
  btn.addEventListener('mouseup', handleEnd);
}

setupTouchButton('btn-up', 'up');
setupTouchButton('btn-down', 'down');
setupTouchButton('btn-left', 'left');
setupTouchButton('btn-right', 'right');

document.getElementById('btn-action').addEventListener('click', () => { audio.init(); toggleVehicle(); });
document.getElementById('btn-radio').addEventListener('click', () => { audio.init(); audio.cycleRadio(); });
document.getElementById('btn-horn').addEventListener('click', () => { audio.init(); audio.playHorn(); });

// --- GAME OBJECTS ---
class Entity {
  constructor(x, y, width, height, color) {
    this.x = x;
    this.y = y;
    this.width = width;
    this.height = height;
    this.color = color;
    this.angle = 0;
    this.speed = 0;
    this.maxSpeed = 0;
    this.accel = 0;
    this.friction = 0.96;
  }

  getBounds() {
    return {
      x: this.x - this.width / 2,
      y: this.y - this.height / 2,
      w: this.width,
      h: this.height
    };
  }
}

class PlayerPedestrian extends Entity {
  constructor(x, y) {
    super(x, y, 16, 16, '#e74c3c');
    this.maxSpeed = 3.5;
    this.accel = 0.4;
    this.health = 100;
    this.inCar = null;
  }

  update() {
    if (this.inCar) return;

    if (keys.up) this.speed = Math.min(this.speed + this.accel, this.maxSpeed);
    if (keys.down) this.speed = Math.max(this.speed - this.accel, -this.maxSpeed / 2);
    
    if (keys.left) this.angle -= 0.08;
    if (keys.right) this.angle += 0.08;

    this.x += Math.cos(this.angle) * this.speed;
    this.y += Math.sin(this.angle) * this.speed;
    this.speed *= this.friction;

    // Map bounds
    this.x = Math.max(50, Math.min(MAP_SIZE - 50, this.x));
    this.y = Math.max(50, Math.min(MAP_SIZE - 50, this.y));
  }

  draw() {
    if (this.inCar) return;
    ctx.save();
    ctx.translate(this.x, this.y);
    ctx.rotate(this.angle);

    // Body
    ctx.fillStyle = this.color;
    ctx.beginPath();
    ctx.arc(0, 0, 8, 0, Math.PI * 2);
    ctx.fill();

    // Head/Shoulders
    ctx.fillStyle = '#f1c40f';
    ctx.beginPath();
    ctx.arc(0, 0, 4, 0, Math.PI * 2);
    ctx.fill();

    // Hands
    ctx.fillStyle = '#e74c3c';
    ctx.fillRect(4, -7, 4, 3);
    ctx.fillRect(4, 4, 4, 3);

    ctx.restore();
  }
}

class Car extends Entity {
  constructor(x, y, color, isPolice = false) {
    super(x, y, 42, 22, color);
    this.maxSpeed = isPolice ? 7.5 : 5.5;
    this.accel = isPolice ? 0.25 : 0.18;
    this.isPolice = isPolice;
    this.isCivilian = !isPolice;
    this.sirenTimer = 0;
    this.isDriver = false;
  }

  update() {
    if (this.isDriver) {
      if (keys.up) this.speed = Math.min(this.speed + this.accel, this.maxSpeed);
      if (keys.down) this.speed = Math.max(this.speed - this.accel, -this.maxSpeed / 2);

      const turnFactor = Math.abs(this.speed) > 0.2 ? (this.speed > 0 ? 1 : -1) : 0;
      if (keys.left) this.angle -= 0.05 * turnFactor;
      if (keys.right) this.angle += 0.05 * turnFactor;

      this.x += Math.cos(this.angle) * this.speed;
      this.y += Math.sin(this.angle) * this.speed;
      this.speed *= this.friction;
    } else if (this.isPolice && wantedLevel > 0) {
      // AI Police Chasing Player
      const target = player.inCar ? player.inCar : player;
      const dx = target.x - this.x;
      const dy = target.y - this.y;
      const targetAngle = Math.atan2(dy, dx);

      // Smooth turn towards player
      let diff = targetAngle - this.angle;
      while (diff < -Math.PI) diff += Math.PI * 2;
      while (diff > Math.PI) diff -= Math.PI * 2;
      this.angle += Math.sign(diff) * Math.min(Math.abs(diff), 0.06);

      this.speed = Math.min(this.speed + this.accel, this.maxSpeed);
      this.x += Math.cos(this.angle) * this.speed;
      this.y += Math.sin(this.angle) * this.speed;

      this.sirenTimer++;
      if (this.sirenTimer % 30 === 0) {
        audio.playSiren();
      }
    } else if (this.isCivilian) {
      // Basic AI Traffic
      this.speed = 2;
      this.x += Math.cos(this.angle) * this.speed;
      this.y += Math.sin(this.angle) * this.speed;

      // Wrap traffic around bounds
      if (this.x < 0) this.x = MAP_SIZE;
      if (this.x > MAP_SIZE) this.x = 0;
      if (this.y < 0) this.y = MAP_SIZE;
      if (this.y > MAP_SIZE) this.y = 0;
    }

    // Keep in map bounds
    this.x = Math.max(30, Math.min(MAP_SIZE - 30, this.x));
    this.y = Math.max(30, Math.min(MAP_SIZE - 30, this.y));
  }

  draw() {
    ctx.save();
    ctx.translate(this.x, this.y);
    ctx.rotate(this.angle);

    // Body
    ctx.fillStyle = this.color;
    ctx.fillRect(-this.width / 2, -this.height / 2, this.width, this.height);

    // Windshield & Roof
    ctx.fillStyle = '#222';
    ctx.fillRect(-this.width / 6, -this.height / 2 + 2, this.width / 3, this.height - 4);

    // Headlights
    ctx.fillStyle = '#fff7c2';
    ctx.fillRect(this.width / 2 - 2, -this.height / 2 + 2, 3, 4);
    ctx.fillRect(this.width / 2 - 2, this.height / 2 - 6, 3, 4);

    // Police Lights
    if (this.isPolice) {
      const flash = Math.floor(Date.now() / 150) % 2 === 0;
      ctx.fillStyle = flash ? '#e74c3c' : '#3498db';
      ctx.fillRect(-2, -6, 5, 12);
    }

    ctx.restore();
  }
}

// --- STATE VARIABLES ---
let player = new PlayerPedestrian(MAP_SIZE / 2, MAP_SIZE / 2);
let vehicles = [];
let wantedLevel = 0; // 0 to 3
let sirenCooldown = 0;
let gameOver = false;

// Initialize Traffic Cars
function initTraffic() {
  vehicles = [];
  const colors = ['#3498db', '#e67e22', '#9b59b6', '#1abc9c', '#f39c12', '#95a5a6'];
  for (let i = 0; i < 25; i++) {
    const rx = Math.random() * (MAP_SIZE - 200) + 100;
    const ry = Math.random() * (MAP_SIZE - 200) + 100;
    const c = new Car(rx, ry, colors[i % colors.length]);
    c.angle = (Math.floor(Math.random() * 4) * Math.PI) / 2; // snap to grid direction
    vehicles.push(c);
  }
}

initTraffic();

// Spawns Police Pursuit
function spawnPolice() {
  if (vehicles.filter(v => v.isPolice).length >= wantedLevel * 2) return;

  const activeObj = player.inCar ? player.inCar : player;
  const offsetAngle = Math.random() * Math.PI * 2;
  const px = activeObj.x + Math.cos(offsetAngle) * 600;
  const py = activeObj.y + Math.sin(offsetAngle) * 600;

  const cop = new Car(px, py, '#2c3e50', true);
  vehicles.push(cop);
}

// Vehicle Interaction (Enter/Exit)
function toggleVehicle() {
  if (player.inCar) {
    // Exit Car
    const car = player.inCar;
    car.isDriver = false;
    player.x = car.x + Math.cos(car.angle + Math.PI / 2) * 30;
    player.y = car.y + Math.sin(car.angle + Math.PI / 2) * 30;
    player.inCar = null;
  } else {
    // Find closest car
    for (let car of vehicles) {
      const dist = Math.hypot(car.x - player.x, car.y - player.y);
      if (dist < 50) {
        player.inCar = car;
        car.isDriver = true;
        
        // Stealing a police car triggers wanted level instantly
        if (car.isPolice && wantedLevel === 0) {
          triggerWanted(1);
        }
        break;
      }
    }
  }
}

// Trigger Wanted Level
function triggerWanted(level) {
  wantedLevel = Math.max(wantedLevel, level);
  updateHUD();
}

// Collision Checks
function checkCollisions() {
  const activeObj = player.inCar ? player.inCar : player;

  for (let i = 0; i < vehicles.length; i++) {
    const v = vehicles[i];

    // Crash check when driving player car
    if (player.inCar && v !== player.inCar) {
      const dist = Math.hypot(player.inCar.x - v.x, player.inCar.y - v.y);
      if (dist < 32) {
        audio.playCrash();
        
        // Push cars apart
        const angle = Math.atan2(v.y - player.inCar.y, v.x - player.inCar.x);
        v.x += Math.cos(angle) * 10;
        v.y += Math.sin(angle) * 10;
        player.inCar.speed *= -0.5;

        // Trigger police wanted status on crash
        if (wantedLevel === 0) {
          triggerWanted(1);
        } else if (wantedLevel < 3 && Math.random() < 0.4) {
          triggerWanted(wantedLevel + 1);
        }
      }
    }

    // Police busting pedestrian / car contact
    if (v.isPolice && wantedLevel > 0) {
      const dist = Math.hypot(activeObj.x - v.x, activeObj.y - v.y);
      if (dist < 35) {
        player.health -= 0.8;
        updateHUD();

        if (player.health <= 0) {
          endGame("BUSTED!", "The police cornered and arrested you.");
        }
      }
    }
  }
}

function updateHUD() {
  document.getElementById('health-fill').style.width = Math.max(0, player.health) + '%';
  let starsStr = '';
  for (let i = 0; i < 3; i++) {
    starsStr += i < wantedLevel ? '★' : '☆';
  }
  document.getElementById('stars').innerText = starsStr;
}

function endGame(title, desc) {
  gameOver = true;
  document.getElementById('go-title').innerText = title;
  document.getElementById('go-desc').innerText = desc;
  document.getElementById('game-over').style.display = 'flex';
}

function restartGame() {
  player = new PlayerPedestrian(MAP_SIZE / 2, MAP_SIZE / 2);
  wantedLevel = 0;
  gameOver = false;
  document.getElementById('game-over').style.display = 'none';
  initTraffic();
  updateHUD();
}

// --- RENDER MAP / CITY ---
function drawMap(camX, camY) {
  // Grass background
  ctx.fillStyle = '#27ae60';
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  ctx.save();
  ctx.translate(-camX + canvas.width / 2, -camY + canvas.height / 2);

  // Draw Roads & City Blocks Grid
  ctx.fillStyle = '#333';
  for (let x = 0; x < MAP_SIZE; x += BLOCK_SIZE) {
    for (let y = 0; y < MAP_SIZE; y += BLOCK_SIZE) {
      // Draw road strips
      ctx.fillRect(x, 0, ROAD_WIDTH, MAP_SIZE);
      ctx.fillRect(0, y, MAP_SIZE, ROAD_WIDTH);
    }
  }

  // Draw Road Markings
  ctx.strokeStyle = '#f1c40f';
  ctx.lineWidth = 3;
  ctx.setLineDash([20, 20]);
  for (let x = 0; x < MAP_SIZE; x += BLOCK_SIZE) {
    ctx.beginPath();
    ctx.moveTo(x + ROAD_WIDTH / 2, 0);
    ctx.lineTo(x + ROAD_WIDTH / 2, MAP_SIZE);
    ctx.stroke();
  }

  // Draw Buildings
  for (let x = ROAD_WIDTH; x < MAP_SIZE; x += BLOCK_SIZE) {
    for (let y = ROAD_WIDTH; y < MAP_SIZE; y += BLOCK_SIZE) {
      const bSize = BLOCK_SIZE - ROAD_WIDTH;
      ctx.fillStyle = '#7f8c8d';
      ctx.fillRect(x + 10, y + 10, bSize - 20, bSize - 20);
      
      // Building Roof detail
      ctx.fillStyle = '#95a5a6';
      ctx.fillRect(x + 25, y + 25, bSize - 50, bSize - 50);
    }
  }

  // Draw Entities
  for (let v of vehicles) v.draw();
  player.draw();

  ctx.restore();
}

// --- MAIN LOOP ---
let lastPoliceSpawn = Date.now();

function gameLoop() {
  if (!gameOver) {
    // Update logic
    player.update();
    if (player.inCar) {
      player.inCar.update();
    }

    for (let v of vehicles) {
      if (v !== player.inCar) v.update();
    }

    checkCollisions();

    // Handle Police Spawns
    if (wantedLevel > 0 && Date.now() - lastPoliceSpawn > 4000) {
      spawnPolice();
      lastPoliceSpawn = Date.now();
    }

    // Camera follow target
    const target = player.inCar ? player.inCar : player;
    drawMap(target.x, target.y);
  }

  requestAnimationFrame(gameLoop);
}

// Start Game
updateHUD();
gameLoop();
</script>
